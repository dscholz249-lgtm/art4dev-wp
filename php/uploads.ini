; Raise media-upload limits for the Railway deployment.
; The stock wordpress:php8.2-apache image ships upload_max_filesize=2M / post_max_size=8M,
; which is too small for real photography. post_max_size must be >= upload_max_filesize.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
